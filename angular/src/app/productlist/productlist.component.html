<div class="product-list" aria-label="Lista de productos">
  <article *ngFor="let product of products" class="product-item">
    <button
      type="button"
      class="product-visual"
      (click)="goToProductDetailsPage(product.id)"
      [attr.aria-label]="'Ver detalles de ' + product.name"
    >
      <img [src]="product.imageUrl" [alt]="product.name" loading="lazy">
    </button>

    <div class="product-info">
      <h3>{{product.name}}</h3>
      <p class="product-description">{{product.description}}</p>

      <div class="product-footer">
        <span class="product-price">{{product.price.toFixed(2) | currency}}</span>

        <ng-container *ngIf="inInCart(product); else addToCartBtn">
          <div class="quantity-controls" aria-label="Cantidad en el carrito">
            <button
              type="button"
              (click)="decrementItem(product)"
              [attr.aria-label]="'Reducir cantidad de ' + product.name"
            >−</button>
            <span aria-live="polite">{{getCartItem(product)?.quantity}}</span>
            <button
              type="button"
              (click)="incrementItem(product)"
              [attr.aria-label]="'Aumentar cantidad de ' + product.name"
            >+</button>
          </div>
        </ng-container>

        <ng-template #addToCartBtn>
          <button type="button" class="cart-button" (click)="addToCart(product)">
            Agregar al carrito
          </button>
        </ng-template>
      </div>
    </div>
  </article>
</div>
