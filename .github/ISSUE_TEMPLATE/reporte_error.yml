name: Reporte de error
description: Registrar un problema del proyecto Mesón del Desierto
title: "[Error] "
labels:
  - bug
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Explica cómo volver a provocar el problema.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      description: Explica qué debería ocurrir.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
      description: Explica qué ocurre realmente.
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Adjunta una captura, un error o un enlace al código.
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad propuesta
      options:
        - P1-crítica
        - P2-alta
        - P3-media
        - P4-baja
    validations:
      required: true
