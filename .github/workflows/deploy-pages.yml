name: Publicar frontend en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "angular/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Instalar dependencias
        working-directory: angular
        run: npm ci

      - name: Compilar Angular para GitHub Pages
        working-directory: angular
        run: npm run build -- --configuration production --base-href /ProyectoAvance/

      - name: Preparar rutas de la aplicación
        shell: bash
        run: |
          cp angular/dist/eccomerce-angular/browser/index.html angular/dist/eccomerce-angular/browser/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar sitio compilado
        uses: actions/upload-pages-artifact@v5
        with:
          path: angular/dist/eccomerce-angular/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
